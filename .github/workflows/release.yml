# Dry-run demonstration only. Tagging and GitHub Releases stay a reviewed
# human step after the release pull request merges. This workflow does not
# create tags, GitHub releases, or registry publishes.

name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version to dry-run (X.Y.Z or X.Y.Z-rc.N). Does not write, tag, or publish.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dry-run:
    name: Release dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Refuse unless this is a dry-run demonstration
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          allowed=0
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            allowed=1
          fi
          case "$REF_NAME" in
            release/*) allowed=1 ;;
          esac
          if [ "$allowed" -ne 1 ]; then
            echo "Refusing to run. This workflow only demonstrates a dry-run on a release/* branch or manual dispatch."
            exit 1
          fi
          echo "Dry-run demonstration allowed for ${EVENT_NAME} on ${REF_NAME}."
          echo "Tagging stays a reviewed human step after merge. This workflow does not create tags or GitHub releases."

      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Dry-run release prepare
        env:
          RELEASE_VERSION: ${{ inputs.version }}
        run: node tools/release/prepare.mjs --version "$RELEASE_VERSION" --dry-run

      - name: Verify release preparation safety
        run: npm exec -- nx run packages:check-release

      - name: Build packages
        run: npx nx run packages:build

      - name: Consumer smoke
        run: npx nx run packages:smoke
