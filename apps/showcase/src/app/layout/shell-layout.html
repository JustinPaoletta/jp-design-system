<jp-app-shell
  [sidebarCollapsed]="sidebarCollapsed"
  [mobileNavOpen]="mobileNavOpen"
  (sidebarCollapsedChange)="sidebarCollapsed = $event"
  (mobileNavOpenChange)="mobileNavOpen = $event"
>
  <nav jpAppShellSidebar aria-label="Primary">
    <jp-stack gap="2xs">
      <jp-app-shell-nav-item
        href="/assistant"
        [active]="isActive('/assistant')"
        (click)="onNavClick($event, '/assistant')"
      >
        <svg
          jpAppShellNavIcon
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path
            d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"
          />
        </svg>
        Assistant
      </jp-app-shell-nav-item>

      <jp-app-shell-nav-item
        href="/overlays"
        [active]="isActive('/overlays')"
        (click)="onNavClick($event, '/overlays')"
      >
        <svg
          jpAppShellNavIcon
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <polygon points="12 2 2 7 12 12 22 7 12 2" />
          <polyline points="2 17 12 22 22 17" />
          <polyline points="2 12 12 17 22 12" />
        </svg>
        Overlays
      </jp-app-shell-nav-item>

      <jp-app-shell-nav-item
        href="/data"
        [active]="isActive('/data')"
        (click)="onNavClick($event, '/data')"
      >
        <svg
          jpAppShellNavIcon
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <ellipse cx="12" cy="5" rx="9" ry="3" />
          <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3" />
          <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5" />
        </svg>
        Data
      </jp-app-shell-nav-item>

      <jp-app-shell-nav-item
        href="/controls"
        [active]="isActive('/controls')"
        (click)="onNavClick($event, '/controls')"
      >
        <svg
          jpAppShellNavIcon
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <line x1="4" y1="21" x2="4" y2="14" />
          <line x1="4" y1="10" x2="4" y2="3" />
          <line x1="12" y1="21" x2="12" y2="12" />
          <line x1="12" y1="8" x2="12" y2="3" />
          <line x1="20" y1="21" x2="20" y2="16" />
          <line x1="20" y1="12" x2="20" y2="3" />
          <line x1="1" y1="14" x2="7" y2="14" />
          <line x1="9" y1="8" x2="15" y2="8" />
          <line x1="17" y1="16" x2="23" y2="16" />
        </svg>
        Controls
      </jp-app-shell-nav-item>

      <jp-app-shell-nav-item
        href="/app-shell"
        [active]="isActive('/app-shell')"
        (click)="onNavClick($event, '/app-shell')"
      >
        <svg
          jpAppShellNavIcon
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="7" height="7" />
          <rect x="14" y="3" width="7" height="7" />
          <rect x="3" y="14" width="7" height="7" />
          <rect x="14" y="14" width="7" height="7" />
        </svg>
        App Shell
      </jp-app-shell-nav-item>

      <jp-app-shell-nav-item
        href="/layout-dashboard"
        [active]="isActive('/layout-dashboard')"
        (click)="onNavClick($event, '/layout-dashboard')"
      >
        <svg
          jpAppShellNavIcon
          viewBox="0 0 24 24"
          width="16"
          height="16"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <rect x="3" y="3" width="18" height="18" rx="2" />
          <line x1="9" y1="3" x2="9" y2="21" />
        </svg>
        Layout
      </jp-app-shell-nav-item>
    </jp-stack>
  </nav>

  <main jpAppShellMain>
    <router-outlet />
  </main>
</jp-app-shell>
