<div class="example-page">
  <header class="example-page__header">
    <jp-heading as="h1">Rays assistant</jp-heading>
    <p>Ask about the Rays, ALCS Game 6 and the World Series.</p>
  </header>
  <div class="example-page__cards">
    <jp-card title="Ask the manager">
      <p>Choose a game, player or roster to start a conversation.</p>
      <jp-inline jpCardActions gap="sm" wrap="true">
        <jp-button
          type="button"
          variant="primary"
          jpAssistantTrigger
          [jpAssistantContext]="deploymentContext"
          >Ask about the game</jp-button
        >
        <jp-button
          type="button"
          variant="secondary"
          jpAssistantTrigger
          [jpAssistantContext]="tableRowContext"
          >Ask about Shane Baz</jp-button
        >
        <jp-button
          type="button"
          variant="ghost"
          jpAssistantTrigger
          [jpAssistantContext]="filterContext"
          [jpAssistantClearMessages]="true"
          >Ask about the roster</jp-button
        >
      </jp-inline>
    </jp-card>
    <jp-card title="Game summary">
      <p>Read a summary of the Rays win in ALCS Game 6.</p>
      <jp-inline jpCardActions gap="sm" wrap="true" align="center">
        <jp-button type="button" variant="secondary" (click)="seedToneDemo()"
          >Load game summary</jp-button
        >
        <p class="example-page__status" role="status">
          Last question: {{ lastReply }}
        </p>
      </jp-inline>
    </jp-card>
  </div>
</div>

<jp-assistant-panel
  title="Rays manager"
  emptyTitle="Ask about the lineup"
  emptyDescription="Ask about players, ALCS Game 6 or the World Series."
  (messageSubmit)="onMessageSubmit($event)"
/>
