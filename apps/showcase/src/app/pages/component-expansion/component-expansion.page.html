<div class="page">
  <jp-page-header
    title="Clubhouse components"
    description="Meet the players, manage club preferences and browse the roster."
    ><span jpPageMeta>2026 Rays</span
    ><jp-button jpPageActions (click)="drawerOpen.set(true)"
      >Open details</jp-button
    ></jp-page-header
  >
  @if (bannerVisible()) {
  <jp-banner
    title="Game 6 archive"
    message="Tampa Bay won Game 6, 7–3, to become the 2026 American League champions."
    dismissible
    (dismissed)="bannerVisible.set(false)"
  />
  }
  <div class="grid">
    <jp-card title="2026 Rays" headingLevel="h2"
      ><div class="row">
        <jp-avatar name="Freddy Peralta" /><jp-avatar
          name="Yandy Díaz"
          src="/missing-avatar.png"
        /><jp-avatar-group
          label="Featured Rays"
          [people]="people"
          [max]="2"
        /><jp-status-dot tone="success" label="Player online" />
      </div>
      <jp-divider decorative /><jp-description-list [items]="details" />
      <div class="measurement">
        <jp-meter
          label="2026 Rays ALCS wins"
          [value]="4"
          [max]="4"
          valueText="4 wins in a best-of-seven series"
        />
      </div>
      <div class="row">
        <jp-spinner label="Refreshing roster" size="lg" /><span
          >Refreshing roster</span
        ><jp-icon name="check" label="Complete" size="lg" /></div
    ></jp-card>
    <jp-card title="Club information" headingLevel="h2"
      ><div class="row">
        <a jpLink href="#preferences">Jump to preferences</a
        ><jp-keyboard-hint [keys]="['Control', 'K']" />
      </div>
      <jp-accordion id="showcase-settings" label="Archive settings"
        ><jp-disclosure title="Archive settings"
          ><p>Collection name, coaches and squad.</p></jp-disclosure
        ><jp-disclosure title="Archive preferences"
          ><p>Game alerts, score updates and roster records.</p></jp-disclosure
        ></jp-accordion
      ><jp-list [items]="services" />
    </jp-card>
  </div>
  <jp-card title="Archive preferences" headingLevel="h2"
    ><form id="preferences" [formGroup]="form" (ngSubmit)="submit()">
      <jp-error-summary [errors]="errors()" />
      <jp-form-section
        legend="Account details"
        hint="Labels and descriptions stay attached to their controls."
        ><jp-form-field
          #emailField
          controlId="expansion-email"
          label="Email"
          hint="Use a demonstration address, such as fan@rays.example."
          [error]="emailError()"
          required
          ><jp-input
            id="expansion-email"
            type="email"
            autocomplete="email"
            formControlName="email"
            [ariaDescribedBy]="emailField.describedBy() || ''"
            [invalid]="!!emailError()"
            required /></jp-form-field
        ><jp-password-field
          id="expansion-password"
          label="Password"
          autocomplete="current-password"
          formControlName="password"
          [error]="submitted() && form.controls.password.invalid ? 'Enter a password.' : ''"
          required /><jp-form-field
          controlId="expansion-native"
          label="Club key"
          hint="A native control can also use the shared wrapper."
          ><input
            jpFieldControl
            class="native-field"
            type="text" /></jp-form-field
      ></jp-form-section>
      <jp-divider decorative />
      <div class="grid">
        <jp-checkbox-group
          label="Notifications"
          [options]="channels"
          formControlName="channels"
        /><jp-segmented-control
          label="View"
          [options]="views"
          formControlName="view"
        />
      </div>
      <jp-multi-select
        id="expansion-reviewers"
        label="Players"
        [options]="reviewers"
        formControlName="reviewers"
        hint="Choose the Game 6 players to include in your collection."
      /><jp-button type="submit">Save preferences</jp-button>@if (saved()) {
      <jp-banner
        title="Preferences saved"
        message="The example keeps these settings in memory."
        tone="success"
        announce
      />
      }
    </form></jp-card
  >
  <jp-card title="Search" headingLevel="h2"
    ><jp-search-field
      label="Search game collections"
      [formControl]="search"
      placeholder="Search by name"
    />
    <p class="query">Query: {{ search.value || 'None' }}</p></jp-card
  >
  <jp-drawer
    title="Game 6 details"
    [open]="drawerOpen()"
    (openChange)="drawerOpen.set($event)"
    ><jp-description-list [items]="details" /><jp-button
      jpDrawerActions
      (click)="drawerOpen.set(false)"
      >Done</jp-button
    ></jp-drawer
  >
</div>
