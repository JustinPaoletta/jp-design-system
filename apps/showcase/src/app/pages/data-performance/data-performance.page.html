<div class="page">
  <jp-page-header
    title="Sample runs"
    description="April through September runs and a 10,000-row roster table."
    ><a jpPageActions jpLink routerLink="/hierarchy">Hierarchy</a
    ><a jpPageActions jpLink routerLink="/scheduling">Scheduling</a
    ><a jpPageActions jpLink routerLink="/interaction-tools"
      >Game preparation</a
    ></jp-page-header
  >
  <jp-card title="Sample runs"
    ><div class="actions">
      <jp-button
        variant="secondary"
        (click)="type.set(type() === 'bar' ? 'line' : 'bar')"
        >{{ type() === 'bar' ? 'Show line chart' : 'Show bar chart'
        }}</jp-button
      >
    </div>
    <jp-chart
      id="delivery-chart"
      label="Team runs by month"
      description="Compare Rays runs with ALCS Game 6 sample values. Open the data table to inspect exact values."
      [labels]="labels"
      [series]="series"
      [type]="type()"
  /></jp-card>
  <jp-card title="2026 Rays roster"
    ><p>
      10,000 fixed-height rows. Scroll to browse or switch to paginated rows for
      complete table navigation. Sorting and selection are controlled by this
      screen.
    </p>
    <jp-disclosure class="rendering-options" title="Rendering options">
      <jp-number-stepper
        id="inventory-overscan"
        label="Extra rows around viewport"
        hint="Compare a minimal window with buffered scrolling. Zero renders only visible rows."
        [min]="0"
        [max]="50"
        [ngModel]="overscan()"
        (ngModelChange)="overscan.set($event ?? 6)"
      />
    </jp-disclosure>
    <jp-virtual-table
      label="2026 Rays roster"
      [columns]="columns"
      [rows]="rows()"
      [overscan]="overscan()"
      selectable
      [selectedKeys]="selected()"
      (selectionChange)="selected.set($event)"
      [sort]="sort()"
      (sortChange)="sort.set($event)"
    />
    <p role="status">{{ selected().length }} players selected</p></jp-card
  >
</div>
