<jp-box padding="lg" maxWidth="wide">
  <jp-stack gap="lg">
    <jp-inline align="center" gap="lg" justify="between" wrap="true">
      <jp-stack gap="xs">
        <jp-inline align="center" gap="md" wrap="true">
          <jp-heading as="h1">Player roster</jp-heading>
          <jp-text size="caption" tone="secondary"
            >{{ visibleRows.length }} players</jp-text
          >
        </jp-inline>
        <jp-text tone="secondary"
          >Review player positions and availability.</jp-text
        >
      </jp-stack>
      <jp-button>Add player</jp-button>
    </jp-inline>

    <jp-table
      caption="Falcons roster"
      [captionHidden]="true"
      [columns]="columns"
      [rows]="visibleRows"
      [striped]="false"
    >
      <ng-template jpTableCell="status" let-value>
        <jp-badge [tone]="statusTone('' + value)">{{ value }}</jp-badge>
      </ng-template>
      <jp-empty-state
        title="No players on the roster"
        description="No players match these filters."
      >
        <jp-button
          variant="secondary"
          type="button"
          (click)="showEmpty = false"
        >
          Clear filters
        </jp-button>
      </jp-empty-state>
    </jp-table>
    <details class="preview-settings">
      <summary>Preview settings</summary>
      <aside aria-label="Example controls">
        <jp-switch [(ngModel)]="showEmpty" name="showEmpty">
          Show empty state
        </jp-switch>
      </aside>
    </details>

    <nav class="related" aria-label="Related examples">
      <a jpLink href="/advanced-layout">Advanced table controls</a>
      <a jpLink href="/data-performance">Charts and large tables</a>
    </nav>
  </jp-stack>
</jp-box>
