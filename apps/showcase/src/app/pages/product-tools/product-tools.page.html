<div class="page">
  <jp-page-header
    title="Game day tools"
    description="Drill completion, numeric controls, activity, and a setup wizard."
    ><a jpPageActions jpLink routerLink="/workflows"
      >Club operations</a
    ></jp-page-header
  >
  <div class="grid">
    <jp-card title="Club registration">
      <jp-stepper
        label="Club registration"
        [steps]="steps()"
        [currentId]="current()"
        navigable
        (stepSelected)="selectStep($event)"
      />
      <form
        (submit)="$event.preventDefault(); current() === 'details' ? next() : save()"
      >
        <jp-error-summary [errors]="errors()" />
        @if (current() === 'details') {
        <h3 #stepHeading tabindex="-1">Game 6 details</h3>
        <jp-input
          id="wizard-email"
          label="Your email"
          type="email"
          [formControl]="email"
          [error]="submitted() && email.invalid ? 'Enter a valid email address.' : ''"
        />
        <jp-number-stepper
          id="wizard-seats"
          label="Players"
          [min]="1"
          [max]="10"
          [formControl]="seats"
          [error]="submitted() && seats.invalid ? 'Choose between one and ten players.' : ''"
        />
        <jp-button type="submit">Continue</jp-button>
        } @else {
        <h3 #stepHeading tabindex="-1">Review club</h3>
        <p>Your email: {{ email.value }}</p>
        <p>Players: {{ seats.value }}</p>
        <div class="actions">
          <jp-button variant="secondary" (click)="back()">Back</jp-button
          ><jp-button type="submit">Save club</jp-button>
        </div>
        @if (saved()) {
        <p role="status">Club saved.</p>
        } }
      </form>
    </jp-card>
    <jp-card title="Game 6 checklist"
      ><jp-checklist
        label="Game tasks"
        [items]="checklist"
        [formControl]="tasks"
    /></jp-card>
    <jp-card title="Numeric controls">
      <div class="numeric">
        <jp-slider
          label="Replay volume"
          [min]="0"
          [max]="100"
          [step]="5"
          [formControl]="volume"
          hint="Use arrow keys or enter an exact value."
        />
        <jp-range-slider
          label="Replay minutes"
          lowerLabel="From"
          upperLabel="To"
          [min]="0"
          [max]="100"
          [step]="5"
          [formControl]="budget"
        />
      </div>
    </jp-card>
    <jp-card title="Activity"
      ><jp-timeline label="Club activity" [events]="events"
    /></jp-card>
    <jp-card title="Players"
      ><div class="reviewers">
        <span>Starting pitcher</span
        ><jp-overflow-chip label="Other players" [items]="overflow" /></div
    ></jp-card>
    <jp-card title="Code examples"
      ><p>
        Import <code jpInlineCode>JpNumberStepper</code> from the UI package.
      </p>
      <jp-code-block
        label="Player count field"
        language="HTML"
        [code]="example"
    /></jp-card>
  </div>
</div>
