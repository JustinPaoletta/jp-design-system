<span
  class="avatar"
  [class.small]="size() === 'sm'"
  [class.large]="size() === 'lg'"
  role="img"
  [attr.aria-label]="name()"
  [attr.aria-busy]="src() && !loaded() && !failed() ? 'true' : null"
>
  <span aria-hidden="true">{{ initials().toUpperCase() }}</span>
  @if (src() && !failed()) { @for (imageSrc of [src()]; track imageSrc) {
  <img
    [src]="imageSrc"
    alt=""
    [class.loaded]="loaded()"
    (load)="onLoad(imageSrc)"
    (error)="onError(imageSrc)"
  />
  } }
</span>
