<section
  [style.border-color]="'var(--jp-color-border-default)'"
  [style.background]="background()"
  [attr.role]="announce() ? (tone() === 'error' ? 'alert' : 'status') : 'region'"
  [attr.aria-label]="title()"
>
  <jp-icon
    class="severity"
    [name]="tone() === 'success' ? 'check' : tone() === 'info' ? 'info' : 'warning'"
    size="md"
    [style.color]="border()"
  />
  <div class="copy">
    <strong>{{ title() }}</strong>@if (message()) {
    <p>{{ message() }}</p>
    }<ng-content />
  </div>
  <div class="actions">
    <ng-content select="[jpBannerActions]" />@if (dismissible()) {
    <button
      type="button"
      [attr.aria-label]="dismissLabel()"
      (click)="dismissed.emit()"
    >
      <jp-icon name="close" size="sm" />
    </button>
    }
  </div>
</section>
