<button
  class="jp-button__root"
  [attr.type]="type()"
  [disabled]="disabled() || loading()"
  [attr.aria-busy]="loading() ? true : null"
  [attr.aria-label]="loading() ? loadingLabel() : null"
  [style.--jp-button-height]="rootHeight()"
>
  <span class="jp-button__content" [attr.aria-hidden]="loading() ? true : null"
    ><ng-content
  /></span>
  @if (loading()) {
  <span class="jp-button__spinner" aria-hidden="true"></span>
  }
</button>
