<figure [attr.aria-busy]="loading()">
  <figcaption>
    <span>{{ label() }}</span>@if (!controlsCollapsed() && !loading() &&
    !error() && !invalid() && labels().length && series().length) {
    <ng-container [ngTemplateOutlet]="legendControls" /> }
  </figcaption>
  @if (description()) {
  <p [id]="id() + '-description'">{{ description() }}</p>
  } @if (loading()) {
  <p class="state" role="status">{{ messages.loading }}</p>
  } @else if (error()) {
  <div class="state" role="alert">
    <p>{{ error() }}</p>
    <jp-button variant="secondary" (click)="retry.emit()"
      >{{ messages.retry }}</jp-button
    >
  </div>
  } @else if (invalid()) {
  <p class="state" role="alert">{{ messages.invalid }}</p>
  } @else if (!labels().length || !series().length) {
  <p class="state">{{ messages.empty }}</p>
  } @else { @if (visible().length) {
  <div class="plot" [attr.data-rendered]="rendered()">
    <canvas
      #canvas
      role="img"
      [attr.aria-label]="label()"
      [attr.aria-describedby]="description() ? id() + '-description' : null"
    ></canvas>
  </div>
  } @else {
  <p class="state">{{ messages.empty }}</p>
  } @if (engineError()) {
  <p role="status">{{ messages.failed }}</p>
  } @if (!controlsCollapsed()) {
  <ng-container [ngTemplateOutlet]="inspectionControls" />
  }
  <details [open]="forcedColors()">
    <summary>
      {{ messages.data }}<jp-icon name="chevron-down" size="sm" />
    </summary>
    @if (controlsCollapsed()) {
    <ng-container [ngTemplateOutlet]="legendControls" />
    <ng-container [ngTemplateOutlet]="inspectionControls" />
    }
    <div
      class="data"
      tabindex="0"
      role="region"
      [attr.aria-label]="messages.data"
    >
      <table>
        <caption>
          {{ label() }}
        </caption>
        <thead>
          <tr>
            <th scope="col">{{ messages.category }}</th>
            @for (item of series(); track item.id) {
            <th scope="col">{{ item.label }}</th>
            }
          </tr>
        </thead>
        <tbody>
          @for (category of labels(); track $index; let i = $index) {
          <tr>
            <th scope="row">{{ category }}</th>
            @for (item of series(); track item.id) {
            <td>{{ format(item.values[i]) }}</td>
            }
          </tr>
          }
        </tbody>
      </table>
    </div>
  </details>
  }
</figure>
<ng-template #legendControls>
  <div class="legend" role="group" [attr.aria-label]="messages.series">
    @for (item of series(); track item.id; let i = $index) {
    <button
      type="button"
      [attr.aria-pressed]="!hiddenSeries().includes(item.id)"
      (click)="toggle(item.id)"
    >
      <span
        class="swatch"
        aria-hidden="true"
        [style.background]="'var(--jp-color-chart-series-' + (i + 1) + ')'"
        >{{ i + 1 }}</span
      >{{ item.label }}
    </button>
    }
  </div>
</ng-template>
<ng-template #inspectionControls>
  <div class="inspection">
    <jp-select
      class="inspect"
      [label]="messages.category"
      [options]="categoryOptions()"
      [ngModel]="'' + index()"
      [ngModelOptions]="{ standalone: true }"
      (ngModelChange)="inspect($event)"
    />
    <dl aria-live="polite">
      @for (item of visible(); track item.id) {
      <div>
        <dt>{{ item.label }} · {{ labels()[index()] }}</dt>
        <dd>{{ format(item.values[index()]) }}</dd>
      </div>
      }
    </dl>
  </div>
</ng-template>
