<label class="jp-checkbox__root">
  <input
    class="jp-checkbox__input"
    type="checkbox"
    [attr.id]="resolvedId()"
    [checked]="checked()"
    [indeterminate]="indeterminate()"
    [required]="required()"
    [attr.name]="name() || null"
    [attr.aria-label]="ariaLabel() || null"
    [attr.aria-describedby]="describedBy()"
    [disabled]="isDisabled()"
    [attr.aria-invalid]="(invalid() || error()) ? true : null"
    (change)="onInputChange($event)"
    (blur)="onBlur()"
  />
  <span class="jp-checkbox__box" aria-hidden="true">
    <svg
      class="jp-checkbox__check"
      viewBox="0 0 16 16"
      width="100%"
      height="100%"
    >
      @if (indeterminate()) {
      <path fill="currentColor" d="M3 7h10v2H3z" />
      } @else {
      <path
        fill="currentColor"
        d="M6.2 11.4 2.8 8l1.1-1.1 2.3 2.3 5-5L12.3 5.3z"
      />
      }
    </svg>
  </span>
  <span class="jp-checkbox__label">
    <ng-content />
  </span>
</label>

@if (error()) {
<p class="jp-checkbox__error" [id]="resolvedId() + '-error'" role="alert">
  {{ error() }}
</p>
} @else if (hint()) {
<p class="jp-checkbox__hint" [id]="resolvedId() + '-hint'">{{ hint() }}</p>
}
