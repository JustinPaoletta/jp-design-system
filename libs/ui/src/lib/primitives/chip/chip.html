<span class="jp-chip__label">{{ label() }}</span>
<button
  type="button"
  class="jp-chip__remove"
  [attr.aria-label]="removeLabel()"
  [disabled]="disabled()"
  (click)="remove()"
>
  <svg
    class="jp-chip__icon"
    viewBox="0 0 16 16"
    fill="none"
    stroke="currentColor"
    stroke-width="1.5"
    stroke-linecap="round"
    aria-hidden="true"
  >
    <path d="M4.5 4.5 11.5 11.5M11.5 4.5 4.5 11.5" />
  </svg>
</button>
