<jp-button
  variant="secondary"
  [disabled]="disabled()"
  [loading]="state() === 'pending'"
  [loadingLabel]="pendingLabel()"
  (click)="copy()"
  ><jp-icon name="copy" size="md" />{{ label() }}</jp-button
>
<span class="feedback" role="status" aria-live="polite"
  >@if (state() === 'pending') { {{ pendingLabel() }} } @else if (state() ===
  'success') { {{ successLabel() }} } @else if (state() === 'failure') { {{
  failureLabel() }} }</span
>
