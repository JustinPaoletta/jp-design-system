<fieldset [disabled]="isDisabled()" [attr.aria-describedby]="describedBy()">
  <legend>{{label()}}</legend>
  <div class="dates">
    <jp-date-picker
      [id]="resolvedId()+'-start'"
      [label]="startLabel()"
      [ngModel]="value()[0]"
      (ngModelChange)="update(0, $event)"
      [min]="min()"
      [max]="max()"
      [required]="required()"
      [disabled]="isDisabled()"
      [readonly]="readonly()"
      [invalid]="!!error()"
      [ariaDescribedBy]="describedBy() || ''"
      [ngModelOptions]="{standalone: true}"
      (focusout)="blur($event)"
    />
    <jp-date-picker
      [id]="resolvedId()+'-end'"
      [label]="endLabel()"
      [ngModel]="value()[1]"
      (ngModelChange)="update(1, $event)"
      [min]="min()"
      [max]="max()"
      [required]="required()"
      [disabled]="isDisabled()"
      [readonly]="readonly()"
      [invalid]="!!error()"
      [ariaDescribedBy]="describedBy() || ''"
      [ngModelOptions]="{standalone: true}"
      (focusout)="blur($event)"
    />
  </div>
  @if(error()){
  <p class="jp-input__error" [id]="resolvedId()+'-error'" role="alert">
    {{error()}}
  </p>
  } @else if(hint()){
  <p class="jp-input__hint" [id]="resolvedId()+'-hint'">{{hint()}}</p>
  }
</fieldset>
