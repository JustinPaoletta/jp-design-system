@if (open()) {
<dialog
  #panel
  class="jp-dialog__panel"
  [class.jp-dialog__panel--start]="placement() === 'start'"
  [class.jp-dialog__panel--end]="placement() === 'end'"
  [class.jp-dialog__panel--bottom]="placement() === 'bottom'"
  role="dialog"
  aria-modal="true"
  [attr.aria-labelledby]="titleId"
  [jpFocusTrap]="true"
  (pointerdown)="onBackdropPointer($event)"
  (cancel)="onNativeCancel($event)"
>
  <div class="jp-dialog__header">
    <h2 class="jp-dialog__title" [id]="titleId">{{ title() }}</h2>
    <button
      type="button"
      class="jp-dialog__close"
      [attr.aria-label]="closeLabel()"
      (click)="close()"
    >
      ×
    </button>
  </div>
  <div class="jp-dialog__body">
    <ng-content />
  </div>
  <ng-content select="[jpDialogActions]" />
</dialog>
}
