<figure>
  <div
    class="jp-media__frame"
    [style.aspect-ratio]="ratio()"
    [attr.aria-busy]="phase() === 'loading'"
  >
    <img
      [src]="src()"
      [alt]="alt()"
      [attr.srcset]="srcset() || null"
      [attr.sizes]="sizes() || null"
      [attr.loading]="loading()"
      decoding="async"
      [style.object-fit]="fit()"
      [hidden]="phase() === 'failed'"
      (load)="onLoad($event)"
      (error)="onError($event)"
    />
    @if (phase() !== 'loaded') {
    <span
      class="jp-media__placeholder"
      [attr.role]="alt() && phase() === 'failed' ? 'img' : null"
      [attr.aria-label]="alt() && phase() === 'failed' ? alt() : null"
      [attr.aria-hidden]="alt() ? null : 'true'"
    >
      {{ phase() === 'failed' ? errorLabel() : loadingLabel() }}
    </span>
    }
  </div>
  @if (caption()) {
  <figcaption>{{ caption() }}</figcaption>
  }
</figure>
