<nav class="jp-pagination" [attr.aria-label]="label()">
  <p class="jp-pagination__summary" aria-live="polite" aria-atomic="true">
    {{ messages.pagination.range({ start: start(), end: end(), total:
    safeTotal(), }) }}
  </p>
  <div class="jp-pagination__controls">
    <jp-button
      variant="ghost"
      size="sm"
      [disabled]="disabled() || currentPage() === 1"
      (click)="goTo(1)"
      >{{ messages.pagination.first }}</jp-button
    >
    <jp-button
      variant="secondary"
      size="sm"
      [disabled]="disabled() || currentPage() === 1"
      (click)="goTo(currentPage() - 1)"
      >{{ messages.pagination.previous }}</jp-button
    >
    <span class="jp-pagination__summary"
      >{{ messages.pagination.page({ page: currentPage(), pageCount:
      pageCount(), }) }}</span
    >
    <jp-button
      variant="secondary"
      size="sm"
      [disabled]="disabled() || currentPage() === pageCount()"
      (click)="goTo(currentPage() + 1)"
      >{{ messages.pagination.next }}</jp-button
    >
    <jp-button
      variant="ghost"
      size="sm"
      [disabled]="disabled() || currentPage() === pageCount()"
      (click)="goTo(pageCount())"
      >{{ messages.pagination.last }}</jp-button
    >
  </div>
</nav>
