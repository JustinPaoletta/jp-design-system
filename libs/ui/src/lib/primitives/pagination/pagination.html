<nav class="jp-pagination" [attr.aria-label]="label()">
  <p class="jp-pagination__summary" aria-live="polite" aria-atomic="true">
    {{ start() }}–{{ end() }} of {{ safeTotal() }}
  </p>
  <div class="jp-pagination__controls">
    <jp-button
      variant="ghost"
      size="sm"
      [disabled]="disabled() || currentPage() === 1"
      (click)="goTo(1)"
      >First page</jp-button
    >
    <jp-button
      variant="secondary"
      size="sm"
      [disabled]="disabled() || currentPage() === 1"
      (click)="goTo(currentPage() - 1)"
      >Previous</jp-button
    >
    <span class="jp-pagination__summary"
      >Page {{ currentPage() }} of {{ pageCount() }}</span
    >
    <jp-button
      variant="secondary"
      size="sm"
      [disabled]="disabled() || currentPage() === pageCount()"
      (click)="goTo(currentPage() + 1)"
      >Next</jp-button
    >
    <jp-button
      variant="ghost"
      size="sm"
      [disabled]="disabled() || currentPage() === pageCount()"
      (click)="goTo(pageCount())"
      >Last page</jp-button
    >
  </div>
</nav>
