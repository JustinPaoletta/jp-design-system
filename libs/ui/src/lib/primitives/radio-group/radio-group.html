<fieldset
  [disabled]="isDisabled()"
  [attr.aria-label]="ariaLabel() || null"
  [attr.aria-describedby]="describedBy()"
  [attr.aria-invalid]="isInvalid() ? true : null"
>
  @if (label()) {
  <legend>{{ label() }}</legend>
  } @for (option of options(); track option.value; let i = $index) {
  <label class="jp-radio-group__option">
    <input
      type="radio"
      [name]="name() || resolvedId()"
      [value]="option.value"
      [checked]="value() === option.value"
      [disabled]="isDisabled() || option.disabled"
      [required]="required()"
      (change)="select(option)"
      (blur)="onBlur()"
      (keydown)="onKeydown($event, i)"
    />
    <span>{{ option.label }}</span>
  </label>
  }
</fieldset>
@if (error()) {
<p class="jp-radio-group__error" [id]="resolvedId() + '-error'" role="alert">
  {{ error() }}
</p>
} @else if (hint()) {
<p class="jp-radio-group__hint" [id]="resolvedId() + '-hint'">{{ hint() }}</p>
}
