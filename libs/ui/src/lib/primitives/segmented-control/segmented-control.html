<fieldset
  [disabled]="isDisabled()"
  [attr.aria-describedby]="describedBy()"
  [attr.aria-invalid]="error() ? true : null"
>
  <legend>{{ label() }}</legend>
  <div class="options">
    @for (option of options(); track option.value) {
    <label [class.selected]="value() === option.value"
      ><input
        type="radio"
        [name]="resolvedId()"
        [value]="option.value"
        [checked]="value() === option.value"
        [disabled]="isDisabled() || !!option.disabled"
        (change)="choose(option)"
        (blur)="onBlur()"
      />{{ option.label }}</label
    >
    }
  </div>
  @if (hint()) {
  <p class="hint" [id]="resolvedId() + '-hint'">{{ hint() }}</p>
  }@if (error()) {
  <p class="error" [id]="resolvedId() + '-error'" role="alert">{{ error() }}</p>
  }
</fieldset>
