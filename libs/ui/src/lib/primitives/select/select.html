<div class="jp-select__field">
  @if (label()) {
  <label class="jp-select__label" [attr.for]="resolvedId()"
    >{{ label() }}</label
  >
  }
  <button
    #control
    type="button"
    role="combobox"
    aria-haspopup="listbox"
    class="jp-select__control"
    [id]="resolvedId()"
    [attr.aria-expanded]="isOpen()"
    [attr.aria-controls]="isOpen() ? resolvedId() + '-listbox' : null"
    [attr.aria-activedescendant]="activeId()"
    [attr.aria-invalid]="isInvalid() ? true : null"
    [attr.aria-required]="required() ? true : null"
    [attr.aria-describedby]="describedBy()"
    [attr.aria-label]="ariaLabel() || null"
    [disabled]="isDisabled()"
    [style.--jp-field-height]="controlHeight()"
    (click)="toggle()"
    (keydown)="onKeydown($event)"
    (blur)="onBlur()"
  >
    <span
      class="jp-select__value"
      [class.jp-select__value--placeholder]="!selectedOption()"
      >{{ selectedOption()?.label ?? placeholder() }}</span
    >
    <jp-icon class="jp-select__chevron" name="chevron-down" size="md" />
  </button>
  <select
    #nativeControl
    class="jp-select__native"
    tabindex="-1"
    aria-hidden="true"
    [attr.name]="name() || null"
    [attr.autocomplete]="autocomplete() || null"
    [required]="required()"
    [disabled]="isDisabled()"
    [value]="selectedOption() ? value() : ''"
    (change)="onSelectChange($event)"
    (invalid)="onNativeInvalid($event)"
    (focus)="focusControl()"
  >
    @if (!hasEmptyOption()) {
    <option value="" hidden [selected]="!selectedOption()"></option>
    } @for (option of options(); track option.value) {
    <option
      [value]="option.value"
      [disabled]="option.disabled ?? false"
      [selected]="option.value === value()"
    >
      {{ option.label }}
    </option>
    }
  </select>
  <div #popup class="jp-select__popup" [hidden]="!isOpen()">
    @if (isOpen()) {
    <div
      role="listbox"
      class="jp-select__listbox"
      [id]="resolvedId() + '-listbox'"
      [attr.aria-label]="label() || ariaLabel()"
    >
      @for (option of options(); track option.value; let i = $index) {
      <button
        type="button"
        role="option"
        tabindex="-1"
        class="jp-select__option"
        [id]="resolvedId() + '-option-' + i"
        [disabled]="option.disabled || false"
        [attr.aria-disabled]="option.disabled || null"
        [attr.aria-selected]="value() === option.value"
        [class.jp-select__option--active]="activeIndex() === i"
        (pointerdown)="$event.preventDefault()"
        (mouseenter)="!option.disabled && activeIndex.set(i)"
        (click)="choose(option)"
      >
        <span>{{ option.label }}</span>
        <jp-icon
          class="jp-select__check"
          [class.jp-select__check--visible]="value() === option.value"
          name="check"
          size="md"
        />
      </button>
      }
    </div>
    }
  </div>
  @if (displayedError()) {
  <p class="jp-select__error" [id]="errorId()" role="alert">
    {{ displayedError() }}
  </p>
  } @else if (hint()) {
  <p class="jp-select__hint" [id]="hintId()">{{ hint() }}</p>
  }
</div>
