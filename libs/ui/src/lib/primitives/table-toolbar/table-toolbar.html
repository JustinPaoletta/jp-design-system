<section class="jp-table-toolbar" [attr.aria-label]="label()">
  <div class="jp-table-toolbar__controls">
    <div class="jp-table-toolbar__search">
      <ng-content select="[jpTableSearch]" />
    </div>
    <ng-content select="[jpTableFilters]" />
    <div class="jp-table-toolbar__actions">
      <ng-content select="[jpTableActions]" />
    </div>
  </div>
  @if (selectedCount() > 0) {
  <div class="jp-table-toolbar__selection">
    <span role="status"
      >{{ messages.tableToolbar.selected(selectedCount()) }}</span
    ><ng-content select="[jpTableBulkActions]" />
  </div>
  } @if (activeFilters().length > 0) {
  <div
    class="jp-table-toolbar__filters"
    [attr.aria-label]="messages.tableToolbar.activeFilters"
  >
    @for (filter of activeFilters(); track filter.key) {
    <jp-button
      variant="secondary"
      size="sm"
      [disabled]="disabled()"
      (click)="remove(filter.key)"
      ><span class="jp-table-toolbar__sr-only"
        >{{ messages.tableToolbar.removeFilter(filter.label) }}</span
      ><span aria-hidden="true">{{ filter.label }} ×</span></jp-button
    >
    }
    <jp-button
      variant="ghost"
      size="sm"
      [disabled]="disabled()"
      (click)="clear()"
      >{{ messages.tableToolbar.clearFilters }}</jp-button
    >
  </div>
  }
</section>
